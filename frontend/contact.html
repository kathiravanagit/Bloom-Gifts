<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact G_giftrees for custom gifts and orders.">
<link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg">
<title>Contact Us | G_giftrees</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<header id="site-header"></header>

<section class="section" style="padding-top:48px;">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Get in touch</span>
      <h2>We'd love to hear from you</h2>
      <p>Questions about an order, a bulk booking, or a custom hamper idea? Send us a note.</p>
    </div>

    <div class="contact-layout">
      <form id="contactForm">
        <div class="form-field">
          <label for="c_name">Your Name</label>
          <input type="text" id="c_name" required>
        </div>
        <div class="form-field">
          <label for="c_email">Your Email</label>
          <input type="email" id="c_email" required>
        </div>
        <div class="form-field">
          <label for="c_message">Message</label>
          <textarea id="c_message" rows="5" required placeholder="Tell us a little about what you're looking for..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Message</button>
      </form>

      <div class="contact-info-card">
        <div class="row">
          <span class="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg></span>
          <div><strong>Visit our Store</strong><br>Pondicherry</div>
        </div>
        <div class="row">
          <span class="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.8c0-1 .8-1.8 1.8-1.8h1.6c.8 0 1.5.5 1.7 1.3l.7 2.5c.2.7-.1 1.5-.7 2l-1.1 1a12.5 12.5 0 0 0 5.8 5.8l1-1.1c.5-.6 1.3-.9 2-.7l2.5.7c.8.2 1.3.9 1.3 1.7v1.6c0 1-.8 1.8-1.8 1.8C11.2 19.6 4.4 12.8 4.5 4.8Z"/></svg></span>
          <div><strong>Call us</strong><br><a href="https://wa.me/917845120668?text=Can%20you%20suggest%20some%20gifts%3F" target="_blank" rel="noopener">+91 78451 20668</a></div>
        </div>
        <div class="row">
          <span class="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M3.5 7 12 13.2 20.5 7"/></svg></span>
          <div><strong>Email</strong><br><a href="mailto:ggiftrees31@gmail.com">ggiftrees31@gmail.com</a></div>
        </div>
        <div class="row">
          <span class="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
          <div><strong>Hours</strong><br>Mon&ndash;Sun, 10am &ndash; 6pm</div>
        </div>
        <div class="row">
          <a href="https://www.instagram.com/g_giftrees?igsi=cWxlZjJ5c2I4dzI3" target="_blank" rel="noopener" aria-label="Instagram" class="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17" cy="7" r="1" fill="currentColor" stroke="none"/></svg></a>
          <div><strong>Follow us</strong><br>Instagram - g_giftrees</div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="config.js"></script>
  <script src="js/shared.js"></script>
<script>
  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('c_name').value.trim();
    const email = document.getElementById('c_email').value.trim();
    const message = document.getElementById('c_message').value.trim();
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); if (!name || !emailOk || !message) {
      showToast('Please fill in all fields.');
      return;
    }
    try {
      const res = await fetch(window.API_BASE_URL + '/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, message }),
      });
      if (!res.ok) throw new Error('failed');
      showToast("Thanks! We'll get back to you shortly.");
      e.target.reset();
    } catch (err) {
      showToast('Could not send your message. Please try again.');
    }
  });
</script>
</body>
</html>
