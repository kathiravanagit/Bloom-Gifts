<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg">
<title>Checkout | G_giftrees</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">

<header id="site-header"></header>

<section class="section" style="padding-top:44px;">
  <div class="container">
    <div class="section-head" style="margin-bottom:30px;">
      <span class="eyebrow">Step 2 of 2</span>
      <h2>Checkout as Guest</h2>
      <p>No account needed &mdash; just your delivery details.</p>
    </div>

    <div class="cart-layout" id="checkoutRoot">
      <div>
        <form id="checkoutForm" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="guest_name">Full Name</label>
              <input type="text" id="guest_name" name="guest_name" autocomplete="name">
              <div class="form-error">Please enter your full name.</div>
            </div>
            <div class="form-field">
              <label for="mobile">Mobile Number</label>
              <input type="tel" id="mobile" name="mobile" autocomplete="tel" placeholder="e.g. 9123 4567">
              <div class="form-error">Please enter a valid mobile number.</div>
            </div>
            <div class="form-field">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" autocomplete="email">
              <div class="form-error">Please enter a valid email address.</div>
            </div>
          </div>

          <div class="form-field full">
            <label for="gift_note">Delivery Notes (optional)</label>
            <textarea id="gift_note" name="gift_note" placeholder="e.g. leave with the guard, call on arrival..."></textarea>
          </div>

          <h4 style="text-transform:uppercase; font-size:0.85rem; letter-spacing:0.05em; margin: 26px 0 10px;">Payment Method</h4>
          <label class="payment-option">
            <input type="radio" name="payment_method" value="Cash on Delivery" checked style="width:18px; height:18px;">
            <span class="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.3" y="6" width="19.4" height="12" rx="1.6"/><circle cx="12" cy="12" r="2.6"/><path d="M5.3 9v0M18.7 15v0"/></svg></span>
            <span>Cash on Delivery &mdash; pay when your gift arrives</span>
          </label>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top:26px;" id="placeOrderBtn">Place Order</button>
        </form>
      </div>

      <div class="summary-card">
        <h3 style="margin-bottom:18px;">Order Summary</h3>
        <div id="checkoutItems"></div>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
        <div class="summary-row"><span>Delivery Fee</span><span id="sumDelivery"></span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal"></span></div>
      </div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="/config.js"></script>
  <script src="js/shared.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
