<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg">
<title>Checkout | G_giftrees</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">

<header id="site-header"></header>

<section class="section" style="padding-top:44px;">
  <div class="container">
    <div class="section-head" style="margin-bottom:30px;">
      <span class="eyebrow" id="sectionEyebrow">Step 2 of 2</span>
      <h2 id="sectionTitle">Checkout</h2>
      <p id="sectionSubtitle"></p>
    </div>

    <div class="cart-layout" id="checkoutRoot">
      <div>
        <form id="checkoutForm" novalidate></form>
      </div>

      <div class="summary-card">
        <h3 style="margin-bottom:18px;">Order Summary</h3>
        <div id="checkoutItems"></div>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal"></span></div>
      </div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="config.js"></script>
  <script src="js/shared.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
