<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="G_giftrees admin dashboard.">
<link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg">
<title>Admin Dashboard | G_giftrees</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-dashboard">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><img src="assets/images/favicon.jpg" alt="" class="header-brand-mark"> G_giftrees Admin</div>
    <nav class="nav-links-admin">
      <a href="#" id="dashboardNav" class="active">Dashboard</a>
      <a href="index.html" target="_blank" rel="noopener">View Storefront</a>
       <a href="#" id="messagesNav">Message from Client <span id="msgBadge" style="display:none; background:var(--plum-deep); color:#fff; border-radius:12px; padding:1px 8px; font-size:0.72rem; margin-left:6px;">0</span></a>
       <a href="#" id="productsNav">Edit Products</a>
       <a href="#" id="logoutLink">Logout</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div id="listView">
      <h2 style="margin-bottom:6px;">Welcome back<span id="adminUsername"></span></h2>
      <p style="margin-bottom:30px;">Here's what's happening with G_giftrees orders.</p>

      <div class="stat-grid" id="statGrid"></div>

      <div class="admin-table-card">
        <div class="table-scroll">
          <table class="orders-table">
            <thead>
              <tr><th>Order #</th><th>Customer</th><th>Placed</th><th>Total</th><th>Status</th></tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="5" style="text-align:center; padding:30px;">Loading orders&hellip;</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

     <div id="detailView" style="display:none;"></div>
     <div id="messagesView" style="display:none;"></div>
     <div id="productsView" style="display:none;"></div>
  </main>
</div>

<script src="config.js"></script>
  <script src="js/shared.js"></script>
<script src="js/admin-dashboard.js"></script>
</body>
</html>
